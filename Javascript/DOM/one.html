<!-- DOM
In JavaScript, the DOM (Document Object Model) is a programming interface that represents an HTML or XML document as a tree of objects.

Think of a web page like this:

<!DOCTYPE html>
<html>
  <body>
    <h1 id="title">Hello World</h1>
    <button>Click Me</button>
  </body>
</html>

The browser converts it into a DOM tree:
Document
 └── html
      └── body
           ├── h1
           │    └── "Hello World"
           └── button
                └── "Click Me"

JavaScript can use the DOM to:
Read page content
Change text and styles
Add or remove elements
Respond to user actions (clicks, typing, etc.)

window is a complex object which cantains various elements related to web page ...one of its element is document

document object represents the entire HTML page loaded in the browser.

window
  └── document
         └── HTML page (DOM)
