 DEFAULT JAVASCRIPT BEHAVIOUR
 * javascript is synchronus langugae that is code is executed from top to bottom line by line 
 * it is single threaded language hence it is slow
 
 BLOCKING CODE (sync) VS NON BLOCKING CODE (async)
 BLOCKING CODE => blocks the flow of the program => sync
 NON BLOCKING CODE => do not blocks the execution => async

 say we wnat to read a file -> so it will take time to read it hence we have two options 
 1st option => wait for the file to be read and then execute the program further (sync)
 2nd option => mean while is being read execute the further code (async)
